<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>금융투자 &amp; 자본시장 OX 챌린지</title>
  <meta name="description" content="올바른 투자 상식과 자본시장 제도를 OX 퀴즈로 확인해보세요. 문항 수와 제한시간을 직접 설정하고, 문제도 자유롭게 등록·수정할 수 있습니다.">
  <meta name="theme-color" content="#020617">
  <meta property="og:type" content="website">
  <meta property="og:title" content="금융투자 &amp; 자본시장 OX 챌린지">
  <meta property="og:description" content="올바른 투자 상식과 자본시장 제도, 지금 바로 OX로 확인해보세요!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f172a%22/><text x=%2216%22 y=%2223%22 font-size=%2216%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22%23f59e0b%22 font-family=%22sans-serif%22>OX</text></svg>">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary-gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --page-pad: clamp(8px, 3vw, 24px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

    html { -webkit-text-size-adjust: 100%; }

    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: max(var(--page-pad), env(safe-area-inset-top));
      padding-bottom: max(var(--page-pad), env(safe-area-inset-bottom));
      padding-left: max(var(--page-pad), env(safe-area-inset-left));
      padding-right: max(var(--page-pad), env(safe-area-inset-right));
      overflow-x: hidden;
      position: relative;
    }

    /* 금융 시장 모티프 배경 그래픽 */
    .market-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .market-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .container {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 980px;
      border-radius: 28px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(30, 58, 138, 0.25);
      overflow: hidden;
    }

    /* 상단 헤더 */
    header {
      background: rgba(30, 41, 59, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .header-ci-wrap {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .ci-badge {
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      flex: none;
    }

    .ci-img {
      height: 48px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    .header-divider {
      width: 1.5px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
      flex: none;
    }

    .header-title-text {
      font-size: 1.35rem;
      font-weight: 800;
      color: #f1f5f9;
      letter-spacing: -0.5px;
      word-break: keep-all;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      margin-left: auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .content-area {
      padding: 44px 40px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; }

    /* 1. 홈 화면 */
    .hero-tag {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--primary-gold);
      color: var(--primary-gold);
      font-weight: 800;
      font-size: clamp(0.9rem, 2.6vw, 1.15rem);
      padding: 6px 18px;
      border-radius: 30px;
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .home-title {
      font-size: clamp(1.9rem, 6.5vw, 3.1rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 16px;
      letter-spacing: -1px;
      word-break: keep-all;
    }
    .home-title span { color: var(--primary-gold); }

    .home-subtitle {
      font-size: clamp(1.02rem, 2.8vw, 1.35rem);
      color: var(--text-sub);
      margin-bottom: 32px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }

    .input-wrapper {
      background: rgba(30, 41, 59, 0.6);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .input-label { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }
    .input-sublabel { font-size: 0.95rem; color: var(--text-sub); margin-top: 4px; }

    .num-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: none;
    }

    .num-btn {
      background: #334155;
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .num-display {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-gold);
      min-width: 50px;
      text-align: center;
    }

    .btn-main {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      padding: 22px;
      border-radius: 16px;
      font-size: clamp(1.15rem, 3.4vw, 1.55rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px var(--gold-glow);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    /* 2. 퀴즈 화면 */
    .quiz-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quiz-badge {
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid #3b82f6;
      color: #60a5fa;
      font-weight: 800;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: clamp(0.88rem, 2.6vw, 1.2rem);
      white-space: nowrap;
    }

    /* 타이머 뱃지 */
    .timer-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid var(--primary-gold);
      color: var(--primary-gold);
      font-weight: 900;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: clamp(0.9rem, 2.7vw, 1.25rem);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .timer-badge.warning {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #f87171;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .progress-bar-wrap {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      height: 12px;
      border-radius: 6px;
      margin-bottom: 36px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, var(--primary-gold));
      width: 0%;
      transition: width 0.4s ease;
    }

    .question-box {
      font-size: clamp(1.15rem, 4.4vw, 2.15rem);
      font-weight: 800;
      line-height: 1.55;
      min-height: 140px;
      margin-bottom: 40px;
      word-break: keep-all;
      overflow-wrap: anywhere;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .ox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 24px;
    }

    .ox-card-btn {
      padding: 36px 20px;
      background: rgba(30, 41, 59, 0.5);
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ox-symbol {
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      font-weight: 900;
      line-height: 1;
    }

    .ox-text { font-size: clamp(0.9rem, 2.8vw, 1.4rem); font-weight: 800; letter-spacing: 1px; white-space: nowrap; }

    .ox-card-btn.o .ox-symbol, .ox-card-btn.o .ox-text { color: #60a5fa; }
    .ox-card-btn.x .ox-symbol, .ox-card-btn.x .ox-text { color: #f87171; }

    .ox-card-btn.o:active { border-color: #3b82f6; background: rgba(37, 99, 235, 0.18); }
    .ox-card-btn.x:active { border-color: #ef4444; background: rgba(239, 68, 68, 0.18); }

    /* 피드백 패널 */
    .feedback-panel {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px 32px;
      margin-top: 10px;
      display: none;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-status {
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 900;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .feedback-status.correct { color: #34d399; }
    .feedback-status.wrong { color: #f87171; }
    .feedback-status.timeout { color: #fbbf24; }

    .feedback-explanation {
      font-size: clamp(1rem, 2.9vw, 1.35rem);
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.04);
      padding: 18px 20px;
      border-radius: 12px;
      border-left: 4px solid var(--primary-gold);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .btn-next-step {
      background: var(--primary-gold);
      color: #0f172a;
      border: none;
      padding: 16px 36px;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      display: block;
      margin-left: auto;
      transition: 0.2s;
    }

    /* 3. 결과 화면 */
    .result-wrap { text-align: center; padding: 20px 0; }
    .result-title { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 800; margin-bottom: 12px; }
    .result-score-large {
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 900;
      color: var(--primary-gold);
      text-shadow: 0 0 30px var(--gold-glow);
      margin: 10px 0 20px 0;
    }
    .result-comment {
      font-size: clamp(1.02rem, 3vw, 1.5rem);
      color: #cbd5e1;
      margin-bottom: 40px;
      word-break: keep-all;
    }

    /* 4. 문제 관리 화면 */
    .manage-head { font-size: clamp(1.1rem, 3.2vw, 1.4rem); font-weight: 800; margin-bottom: 14px; color: var(--primary-gold); }

    .manage-box {
      max-height: 280px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .manage-row {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .manage-row:last-child { border-bottom: none; }

    .manage-info { flex: 1 1 55%; min-width: 0; }
    .manage-q-text { font-size: 1.1rem; font-weight: 600; line-height: 1.4; color: #f8fafc; word-break: keep-all; overflow-wrap: anywhere; }
    .manage-exp-text { font-size: 0.95rem; color: #94a3b8; margin-top: 4px; word-break: keep-all; overflow-wrap: anywhere; }

    .pill { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 1rem; display: inline-block; flex: none; }
    .pill.o { background: rgba(37, 99, 235, 0.3); color: #60a5fa; border: 1px solid #3b82f6; }
    .pill.x { background: rgba(239, 68, 68, 0.3); color: #f87171; border: 1px solid #ef4444; }

    .btn-group { display: flex; gap: 8px; align-items: center; flex: none; }

    .edit-btn-custom {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .del-btn-custom {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .form-container {
      background: rgba(30, 41, 59, 0.4);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }

    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      color: white;
      font-size: 1.05rem;
      resize: vertical;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus {
      outline: none;
      border-color: var(--primary-gold);
    }

    .form-actions { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }

    .btn-submit {
      flex: 1 1 200px;
      background: var(--primary-gold);
      color: #0f172a;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-cancel {
      display: none;
      background: #475569;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    /* ── 마우스 포인터 기기에서만 hover 효과 (터치 잔상 방지) ── */
    @media (hover: hover) and (pointer: fine) {
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        transform: translateY(-2px);
      }
      .num-btn:hover { background: var(--primary-gold); color: #0f172a; }
      .btn-main:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 35px rgba(245, 158, 11, 0.5);
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      }
      .ox-card-btn.o:hover {
        border-color: #3b82f6;
        background: rgba(37, 99, 235, 0.18);
        transform: translateY(-6px);
        box-shadow: 0 15px 30px rgba(37, 99, 235, 0.35);
      }
      .ox-card-btn.x:hover {
        border-color: #ef4444;
        background: rgba(239, 68, 68, 0.18);
        transform: translateY(-6px);
        box-shadow: 0 15px 30px rgba(239, 68, 68, 0.35);
      }
      .btn-next-step:hover { background: #fbbf24; transform: scale(1.03); }
      .edit-btn-custom:hover { background: #2563eb; color: white; }
      .del-btn-custom:hover { background: #dc2626; color: white; }
      .btn-submit:hover { background: #fbbf24; }
      .btn-cancel:hover { background: #64748b; }
    }

    /* ── 태블릿 ── */
    @media (max-width: 900px) {
      .container { border-radius: 22px; }
      header { padding: 14px 24px; }
      .content-area { padding: 32px 26px; min-height: 460px; }
      .ox-grid { gap: 20px; }
      .ox-card-btn { padding: 28px 16px; }
      .question-box { min-height: 120px; margin-bottom: 30px; }
      .settings-grid { gap: 16px; }
    }

    /* ── 모바일 ── */
    @media (max-width: 640px) {
      .container { border-radius: 18px; }

      header { padding: 12px 16px; gap: 10px; }
      .header-ci-wrap { gap: 10px; }
      .header-divider { display: none; }
      .ci-img { height: 34px; }
      .header-title-text {
        order: 3;
        width: 100%;
        font-size: 0.98rem;
        line-height: 1.35;
      }
      .nav-btn { padding: 8px 12px; font-size: 0.9rem; border-radius: 10px; }

      .content-area { padding: 24px 16px; min-height: auto; }

      .hero-tag { padding: 5px 14px; margin-bottom: 14px; }
      .home-title { margin-bottom: 12px; letter-spacing: -0.5px; }
      .home-subtitle { margin-bottom: 24px; }

      .settings-grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
      .input-wrapper { padding: 16px 18px; border-radius: 14px; }
      .input-label { font-size: 1.05rem; }
      .input-sublabel { font-size: 0.85rem; }
      .num-display { font-size: 1.5rem; min-width: 42px; }

      .btn-main { padding: 18px; border-radius: 14px; }
      .btn-main svg { width: 22px; height: 22px; }

      .quiz-badge, .timer-badge { padding: 6px 12px; }
      .timer-badge svg { width: 18px; height: 18px; }
      .progress-bar-wrap { height: 10px; margin-bottom: 24px; }

      .question-box { min-height: 96px; margin-bottom: 24px; line-height: 1.5; }

      .ox-grid { gap: 12px; margin-bottom: 16px; }
      .ox-card-btn { padding: 22px 8px; border-radius: 18px; border-width: 2px; gap: 8px; }

      .feedback-panel { padding: 20px 18px; border-radius: 16px; }
      .feedback-explanation { padding: 14px 16px; margin-bottom: 18px; }
      .btn-next-step { width: 100%; padding: 15px 20px; font-size: 1.1rem; }

      .result-wrap { padding: 10px 0; }
      .result-comment { margin-bottom: 28px; }

      .manage-box { max-height: 42vh; margin-bottom: 18px; }
      .manage-row { flex-wrap: wrap; padding: 12px 14px; }
      .manage-info { flex: 1 1 60%; }
      .manage-q-text { font-size: 1rem; }
      .manage-exp-text { font-size: 0.88rem; }
      .btn-group { margin-left: auto; }

      .form-container { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 0; }
      .btn-submit, .btn-cancel { flex: 1 1 100%; }

      .market-svg { height: 30%; }
    }

    /* ── 소형 기기 ── */
    @media (max-width: 380px) {
      .header-title-text { font-size: 0.88rem; }
      .ci-img { height: 30px; }
      .nav-btn { padding: 7px 10px; font-size: 0.82rem; }
      .content-area { padding: 20px 12px; }
      .ox-card-btn { padding: 18px 6px; }
      .num-btn { width: 40px; height: 40px; font-size: 1.3rem; }
      .num-display { font-size: 1.35rem; min-width: 36px; }
      .input-wrapper { padding: 14px 14px; }
    }

    /* ── 초소형 기기: 설정 카드 세로 스택 ── */
    @media (max-width: 350px) {
      .input-wrapper { flex-direction: column; align-items: stretch; gap: 12px; }
      .num-selector { justify-content: space-between; }
      .input-label { font-size: 1rem; }
    }

    /* ── 가로 모드(낮은 높이) ── */
    @media (max-height: 560px) and (orientation: landscape) {
      body { align-items: flex-start; }
      header { padding-top: 8px; padding-bottom: 8px; }
      .ci-img { height: 30px; }
      .content-area { min-height: auto; padding-top: 18px; padding-bottom: 18px; }
      .hero-tag { margin-bottom: 10px; }
      .home-title { font-size: clamp(1.5rem, 5.5vh, 2.2rem); margin-bottom: 10px; }
      .home-subtitle { font-size: 1rem; margin-bottom: 18px; }
      .settings-grid { margin-bottom: 18px; }
      .quiz-status-bar { margin-bottom: 10px; }
      .progress-bar-wrap { margin-bottom: 18px; }
      .question-box { font-size: clamp(1rem, 4.4vh, 1.5rem); min-height: auto; margin-bottom: 18px; line-height: 1.45; }
      .ox-grid { gap: 14px; }
      .ox-card-btn { padding: 12px 10px; gap: 6px; }
      .ox-symbol { font-size: clamp(1.8rem, 8vh, 3rem); }
      .ox-text { font-size: 0.9rem; }
      .feedback-panel { padding: 16px 18px; }
      .feedback-status { font-size: 1.2rem; margin-bottom: 10px; }
      .feedback-explanation { font-size: 0.98rem; padding: 12px 14px; margin-bottom: 14px; }
      .result-wrap { padding: 0; }
      .result-comment { margin-bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .timer-badge.warning { animation: none; }
    }
  </style>
</head>
<body>

  <div class="market-bg"></div>
  <svg class="market-svg" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <path fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="4" d="M0,280 L120,240 L240,260 L360,190 L480,210 L600,120 L720,160 L840,90 L960,130 L1080,70 L1200,110 L1320,40 L1440,90"></path>
    <path fill="url(#chart-grad)" opacity="0.1" d="M0,280 L120,240 L240,260 L360,190 L480,210 L600,120 L720,160 L840,90 L960,130 L1080,70 L1200,110 L1320,40 L1440,90 L1440,320 L0,320 Z"></path>
    <defs>
      <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">
    <header>
      <div class="header-ci-wrap">
        <div class="ci-badge">
          <img src="kofia-logo.png" alt="금융투자협회" class="ci-img" width="400" height="159">
        </div>
        <div class="header-divider"></div>
      </div>
      <div class="header-title-text">금융투자 &amp; 자본시장 OX 챌린지</div>
      <button class="nav-btn" id="nav-btn" onclick="toggleScreen('manage')">⚙ 문제 관리</button>
    </header>

    <div class="content-area">
      <!-- 1. 홈 화면 (문항 수 + 제한시간 설정) -->
      <div id="screen-home" class="screen active">
        <div class="hero-tag">📊 INVESTOR LEVEL-UP</div>
        <h1 class="home-title">금융투자 &amp; 자본시장<br><span>OX 챌린지</span></h1>
        <p class="home-subtitle">올바른 투자 상식과 자본시장 제도, 지금 바로 OX로 확인해보세요!</p>

        <div class="settings-grid">
          <!-- 문항 수 설정 -->
          <div class="input-wrapper">
            <div>
              <div class="input-label">출제 문항 수</div>
              <div class="input-sublabel">등록 문제: 총 <span id="total-count-label" style="color: var(--primary-gold); font-weight: 800;">0</span>개</div>
            </div>
            <div class="num-selector">
              <button class="num-btn" onclick="adjustCount(-1)" aria-label="문항 수 줄이기">−</button>
              <div class="num-display" id="selected-count">5</div>
              <button class="num-btn" onclick="adjustCount(1)" aria-label="문항 수 늘리기">+</button>
            </div>
          </div>

          <!-- 문제당 제한시간 설정 -->
          <div class="input-wrapper">
            <div>
              <div class="input-label">문제당 제한시간</div>
              <div class="input-sublabel">초 단위 (10~60초)</div>
            </div>
            <div class="num-selector">
              <button class="num-btn" onclick="adjustTime(-5)" aria-label="제한시간 줄이기">−</button>
              <div class="num-display" id="selected-time">10</div>
              <button class="num-btn" onclick="adjustTime(5)" aria-label="제한시간 늘리기">+</button>
            </div>
          </div>
        </div>

        <button class="btn-main" onclick="startQuiz()">
          도전 시작하기 (START)
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>

      <!-- 2. 퀴즈 화면 -->
      <div id="screen-quiz" class="screen">
        <div class="quiz-status-bar">
          <span class="quiz-badge" id="quiz-progress-text">QUESTION 01 / 05</span>

          <!-- 실시간 제한시간 표시 티커 -->
          <div class="timer-badge" id="timer-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="time-left-text">10s</span>
          </div>
        </div>

        <!-- 진행률 바 -->
        <div class="progress-bar-wrap">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-box" id="question-text">문제가 로딩 중입니다...</div>

        <div class="ox-grid" id="ox-buttons">
          <button class="ox-card-btn o" onclick="handleAnswer('O')">
            <div class="ox-symbol">O</div>
            <div class="ox-text">그렇다 (TRUE)</div>
          </button>
          <button class="ox-card-btn x" onclick="handleAnswer('X')">
            <div class="ox-symbol">X</div>
            <div class="ox-text">아니다 (FALSE)</div>
          </button>
        </div>

        <div class="feedback-panel" id="feedback-panel">
          <div class="feedback-status" id="feedback-title"></div>
          <div class="feedback-explanation" id="feedback-desc"></div>
          <button class="btn-next-step" onclick="nextQuestion()">NEXT ▶</button>
        </div>
      </div>

      <!-- 3. 결과 화면 -->
      <div id="screen-result" class="screen">
        <div class="result-wrap">
          <div class="hero-tag" style="align-self: center; margin-bottom: 20px;">CHALLENGE FINISHED</div>
          <h2 class="result-title">최종 퀴즈 결과</h2>
          <div class="result-score-large" id="result-score">0 / 0</div>
          <div class="result-comment" id="result-desc">수고하셨습니다!</div>
          <button class="btn-main" style="max-width: 360px; margin: 0 auto;" onclick="toggleScreen('home')">처음 화면으로</button>
        </div>
      </div>

      <!-- 4. 문제 관리 화면 -->
      <div id="screen-manage" class="screen">
        <div class="manage-head">📋 등록된 문항 목록 (<span id="manage-count">0</span>)</div>
        <div class="manage-box" id="manage-list"></div>

        <div class="form-container">
          <div class="manage-head" id="form-title" style="margin-bottom: 12px;">➕ 신규 문항 등록</div>

          <div class="form-field">
            <label for="q-input">문제 내용</label>
            <input type="text" id="q-input" placeholder="문제 내용을 입력하세요.">
          </div>

          <div class="form-grid">
            <div class="form-field">
              <label for="a-input">정답 선택</label>
              <select id="a-input">
                <option value="O">O (그렇다)</option>
                <option value="X">X (아니다)</option>
              </select>
            </div>
            <div class="form-field">
              <label for="e-input">해설 작성</label>
              <input type="text" id="e-input" placeholder="정답/오답 해설을 입력하세요.">
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-submit" id="btn-save" onclick="saveFormQuestion()">새 문제 저장하기</button>
            <button class="btn-cancel" id="btn-cancel-edit" onclick="cancelEdit()">수정 취소</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 기본 문제 세트 (브라우저 LocalStorage에 저장된 문항이 있으면 그쪽이 우선 적용됩니다)
    const DEFAULT_QUESTIONS = [
      { question: "주식 발행 회사가 파산할 경우, 주주는 채권자보다 회사 잔여재산에 대한 우선변제권을 갖는다.", answer: "X", explanation: "채권자가 주주보다 우선변제권을 가지며, 주주는 잔여재산 분배에서 최후순위입니다." },
      { question: "ETF(상장지수펀드)는 펀드이지만 거래소에 상장되어 주식처럼 실시간 매매가 가능하다.", answer: "O", explanation: "ETF는 인덱스펀드를 거래소에 상장시켜 주식처럼 실시간 호가로 매매할 수 있는 상품입니다." },
      { question: "채권 가격과 시장 금리는 서로 비례 관계(금리 상승 시 채권 가격 상승)에 있다.", answer: "X", explanation: "시장 금리가 오르면 기존 발행 채권의 표면금리 매력도가 낮아져 채권 가격은 하락(역의 관계)합니다." },
      { question: "국내 정규 주식시장(코스피/코스닥)의 일일 가격제한폭은 전일 종가 대비 ±30%이다.", answer: "O", explanation: "한국거래소 규정상 정규 주식시장의 하루 상·하한가 가격제한폭은 기준가 대비 ±30%입니다." },
      { question: "PER(주가수익비율)은 현재 주가를 주당순자산가치(BPS)로 나눈 지표이다.", answer: "X", explanation: "PER은 주가를 주당순이익(EPS)으로 나눈 값이며, 주가를 BPS로 나눈 지표는 PBR입니다." },
      { question: "공매도는 주식을 빌려서 먼저 매도한 후, 주가가 하락하면 매수 상환하여 차익을 얻는 투자 기법이다.", answer: "O", explanation: "주가 하락을 예상하여 차입 매도 후 저가에 재매수(숏커버링)해 상환 차익을 내는 방식입니다." },
      { question: "선물(Futures) 거래는 만기일에 정해진 가격으로 자산을 '인수할 권리'만을 사고파는 거래이다.", answer: "X", explanation: "권리만을 매매하는 것은 '옵션(Option)'이며, 선물 거래는 만기일에 결제를 이행해야 하는 계약적 '의무'가 발생합니다." }
    ];

    let questions = JSON.parse(localStorage.getItem("kofia_quiz_v1")) || DEFAULT_QUESTIONS;
    function saveToStorage() { localStorage.setItem("kofia_quiz_v1", JSON.stringify(questions)); }

    let currentPool = [];
    let currentIndex = 0;
    let score = 0;
    let selectedCount = 5;
    let selectedTimeLimit = 10; // 기본 10초
    let timeLeft = 10;
    let timerInterval = null;
    let editingIndex = -1;

    const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    function escapeHtml(str) {
      return String(str == null ? "" : str).replace(/[&<>"']/g, ch => HTML_ESCAPES[ch]);
    }

    function init() {
      selectedCount = Math.min(5, questions.length);
      updateCountDisplay();
      renderManageList();
    }

    function adjustCount(delta) {
      selectedCount += delta;
      updateCountDisplay();
    }

    function adjustTime(delta) {
      selectedTimeLimit = Math.max(10, Math.min(60, selectedTimeLimit + delta));
      document.getElementById("selected-time").innerText = selectedTimeLimit;
    }

    function updateCountDisplay() {
      // 문항이 삭제되면 등록 수보다 큰 출제 수가 남을 수 있어 표시 직전에 보정
      selectedCount = Math.min(Math.max(1, selectedCount), Math.max(1, questions.length));
      document.getElementById("total-count-label").innerText = questions.length;
      document.getElementById("selected-count").innerText = selectedCount;
      document.getElementById("manage-count").innerText = questions.length;
    }

    function toggleScreen(screenName) {
      clearInterval(timerInterval);
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const navBtn = document.getElementById("nav-btn");

      if (screenName === 'manage') {
        document.getElementById("screen-manage").classList.add('active');
        navBtn.innerText = "← 홈으로";
        navBtn.setAttribute("onclick", "toggleScreen('home')");
        cancelEdit();
      } else {
        document.getElementById("screen-" + screenName).classList.add('active');
        navBtn.innerText = "⚙ 문제 관리";
        navBtn.setAttribute("onclick", "toggleScreen('manage')");
        updateCountDisplay();
      }
    }

    function startQuiz() {
      if (questions.length === 0) {
        alert("등록된 문제가 없습니다. 관리 메뉴에서 문제를 추가해주세요.");
        return;
      }
      currentPool = [...questions].sort(() => 0.5 - Math.random()).slice(0, selectedCount);
      currentIndex = 0;
      score = 0;

      toggleScreen('quiz');
      showQuestion();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = selectedTimeLimit;
      const timerBadge = document.getElementById("timer-badge");
      const timeText = document.getElementById("time-left-text");

      timerBadge.classList.remove("warning");
      timeText.innerText = `${timeLeft}s`;

      timerInterval = setInterval(() => {
        timeLeft--;
        timeText.innerText = `${timeLeft}s`;

        if (timeLeft <= 5) {
          timerBadge.classList.add("warning");
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function showQuestion() {
      const q = currentPool[currentIndex];
      const qNum = (currentIndex + 1).toString().padStart(2, '0');
      const totalNum = currentPool.length.toString().padStart(2, '0');

      document.getElementById("quiz-progress-text").innerText = `QUESTION ${qNum} / ${totalNum}`;

      // 1번 문제는 (1/총수량)만큼 차오르고, 마지막 문제에서 100%가 됨
      const progressPercent = ((currentIndex + 1) / currentPool.length) * 100;
      document.getElementById("progress-fill").style.width = `${progressPercent}%`;

      document.getElementById("question-text").innerText = q.question;
      document.getElementById("ox-buttons").style.display = "grid";
      document.getElementById("feedback-panel").style.display = "none";

      startTimer();
    }

    function handleAnswer(userChoice) {
      clearInterval(timerInterval);
      const q = currentPool[currentIndex];
      const isCorrect = (userChoice === q.answer);
      if (isCorrect) score++;

      document.getElementById("ox-buttons").style.display = "none";
      const feedbackPanel = document.getElementById("feedback-panel");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackDesc = document.getElementById("feedback-desc");

      feedbackTitle.className = "feedback-status " + (isCorrect ? "correct" : "wrong");
      feedbackTitle.innerHTML = isCorrect
        ? "🎉 정답입니다! (+1점)"
        : `❌ 오답입니다! (정답: <span style="color:var(--primary-gold); margin-left:6px;">${escapeHtml(q.answer)}</span>)`;

      feedbackDesc.innerText = q.explanation || "등록된 상세 해설이 없습니다.";
      feedbackPanel.style.display = "block";
    }

    /* 시간 초과 시 처리 */
    function handleTimeOut() {
      const q = currentPool[currentIndex];
      document.getElementById("ox-buttons").style.display = "none";

      const feedbackPanel = document.getElementById("feedback-panel");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackDesc = document.getElementById("feedback-desc");

      feedbackTitle.className = "feedback-status timeout";
      feedbackTitle.innerHTML = `⏰ 시간 초과! (정답: <span style="color:var(--primary-gold); margin-left:6px;">${escapeHtml(q.answer)}</span>)`;

      feedbackDesc.innerText = q.explanation || "등록된 상세 해설이 없습니다.";
      feedbackPanel.style.display = "block";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentPool.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      clearInterval(timerInterval);
      toggleScreen('result');
      const total = currentPool.length;
      const rate = Math.round((score / total) * 100);
      document.getElementById("result-score").innerText = `${score} / ${total}`;

      let comment = "";
      if (rate === 100) comment = "🏆 완벽합니다! 자본시장 금융투자 마스터 달성!";
      else if (rate >= 80) comment = "👏 대단합니다! 우수한 금융투자 역량을 보유하셨습니다.";
      else if (rate >= 50) comment = "💡 좋습니다! 조금만 더 공부하면 완벽해집니다.";
      else comment = "📚 금융투자협회의 다양한 투자자 교육 콘텐츠를 만나보세요!";

      document.getElementById("result-desc").innerText = comment;
    }

    function renderManageList() {
      const listEl = document.getElementById("manage-list");
      listEl.innerHTML = "";
      questions.forEach((q, idx) => {
        const row = document.createElement("div");
        row.className = "manage-row";
        row.innerHTML = `
          <span class="pill ${q.answer.toLowerCase()}">${escapeHtml(q.answer)}</span>
          <div class="manage-info">
            <div class="manage-q-text">${escapeHtml(q.question)}</div>
            <div class="manage-exp-text">💡 ${escapeHtml(q.explanation) || '해설 없음'}</div>
          </div>
          <div class="btn-group">
            <button class="edit-btn-custom" onclick="startEditQuestion(${idx})">수정</button>
            <button class="del-btn-custom" onclick="deleteQuestion(${idx})">삭제</button>
          </div>
        `;
        listEl.appendChild(row);
      });
      updateCountDisplay();
    }

    function startEditQuestion(idx) {
      editingIndex = idx;
      const q = questions[idx];

      document.getElementById("form-title").innerText = `✏️ 문항 수정 (No. ${idx + 1})`;
      document.getElementById("q-input").value = q.question;
      document.getElementById("a-input").value = q.answer;
      document.getElementById("e-input").value = q.explanation || "";

      document.getElementById("btn-save").innerText = "수정 완료 (저장)";
      document.getElementById("btn-cancel-edit").style.display = "inline-block";
      document.getElementById("q-input").focus();
    }

    function cancelEdit() {
      editingIndex = -1;
      document.getElementById("form-title").innerText = "➕ 신규 문항 등록";
      document.getElementById("q-input").value = "";
      document.getElementById("a-input").value = "O";
      document.getElementById("e-input").value = "";
      document.getElementById("btn-save").innerText = "새 문제 저장하기";
      document.getElementById("btn-cancel-edit").style.display = "none";
    }

    function saveFormQuestion() {
      const qText = document.getElementById("q-input").value.trim();
      const ans = document.getElementById("a-input").value;
      const exp = document.getElementById("e-input").value.trim();

      if (!qText) {
        alert("문제 내용을 입력해주세요.");
        return;
      }

      if (editingIndex >= 0) {
        questions[editingIndex] = { question: qText, answer: ans, explanation: exp };
        alert("문항 수정이 완료되었습니다.");
      } else {
        questions.push({ question: qText, answer: ans, explanation: exp });
        alert("새 문항이 등록되었습니다.");
      }

      saveToStorage();
      renderManageList();
      cancelEdit();
    }

    function deleteQuestion(idx) {
      if (confirm("이 문제를 삭제하시겠습니까?")) {
        questions.splice(idx, 1);
        saveToStorage();
        if (editingIndex === idx) cancelEdit();
        renderManageList();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
